# go-apisix-extend 网关配置示例
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 5s

routes:
  - method: "GET"
    path: "/api/v1/users"
    backend: "http://127.0.0.1:18080"
    weight: 1
    plugins: ["auth", "rate_limit"]

  - method: "POST"
    path: "/api/v1/users"
    backend: "http://127.0.0.1:18080"
    weight: 1
    plugins: ["auth", "rate_limit"]

  - method: "GET"
    path: "/api/v1/orders"
    backend: "http://127.0.0.1:18081"
    weight: 1
    plugins: ["auth"]

  - method: "GET"
    path: "/health"
    backend: "http://127.0.0.1:18080"
    weight: 1

plugins:
  auth:
    secret: "change-me-to-a-secure-key"
    enabled: true
  rate_limit:
    rate: 1000
    capacity: 100
    enabled: true
